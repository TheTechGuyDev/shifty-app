name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['admin/**', '.github/workflows/build-and-deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          set +e
          flutter pub get
          flutter build apk --release > apk.txt 2>&1
          code=$?
          cat apk.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|exception|failed|what went wrong" apk.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=APK build::$msg"
          fi
          exit $code

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk shifty.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest shifty.apk \
            --title "Shifty Android test build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Test build, not for the Play Store." \
            --prerelease
