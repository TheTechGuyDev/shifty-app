name: shifty
description: House services marketplace app (working name Shifty).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.0.10
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: any
  http: ^1.2.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  video_player: ^2.9.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
    - assets/images/app/
